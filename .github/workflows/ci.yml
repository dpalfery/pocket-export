# CI — build, test, multi-language gates (.NET, Python, TypeScript/React, Tauri Rust),
# and security scanning (CodeQL, Trivy fs, Semgrep Community SAST, Gitleaks).
# Modeled directly on dpalfery/kyber-weave's CI & Security pipeline.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly CodeQL / dependency scan fallback when the tree is quiet
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore PocketExport.sln

      - name: Format (whitespace)
        run: >
          dotnet format PocketExport.sln whitespace
          --verify-no-changes
          --no-restore
          -v minimal

      - name: List vulnerable NuGet packages
        run: |
          set -euo pipefail
          output="$(dotnet list PocketExport.sln package --vulnerable --include-transitive 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eqi 'has the following vulnerable packages'; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Build
        run: dotnet build PocketExport.sln -c ${{ env.CONFIGURATION }} --no-restore -nr:false -p:UseSharedCompilation=false

      - name: Test
        run: >
          dotnet test tests/PocketExport.Core.Tests/PocketExport.Core.Tests.csproj
          -c ${{ env.CONFIGURATION }}
          --no-build
          -nr:false
          -p:UseSharedCompilation=false
          --logger "trx;LogFileName=pocket-export.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

  python-gates:
    name: Python ML Worker gates
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies (frozen lockfile)
        working-directory: src/audio-worker
        run: uv sync --frozen

      - name: Run pytest suite
        working-directory: src/audio-worker
        run: uv run pytest -v

  ts-gates:
    name: TypeScript & React UI gates
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        working-directory: src/ui
        run: npm run typecheck

      - name: Run Vitest component tests
        working-directory: src/ui
        run: npm test

      - name: Production Vite bundle check
        working-directory: src/ui
        run: npm run build

  tauri-rust:
    name: Tauri Rust gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libgtk-3-dev libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node for UI dist
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Build UI frontendDist for Tauri context
        working-directory: src/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, python, javascript-typescript]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Intentional github/codeql-action v4 pin (v4.38.2)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Build solution
        if: matrix.language == 'csharp'
        run: |
          set -euo pipefail
          dotnet restore PocketExport.sln
          dotnet build PocketExport.sln --configuration Release --no-restore -nr:false -p:UseSharedCompilation=false

      # Intentional github/codeql-action v4 pin (v4.38.2)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  trivy:
    name: Trivy OSS Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install verified Trivy CLI
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/trivy/bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/trivy/bin" trivy
          echo "$RUNNER_TEMP/trivy/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/trivy/bin/trivy" --version

      - name: Scan repository with Trivy
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln,misconfig,secret,license \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy.json \
            --skip-dirs .git \
            --skip-dirs TestResults \
            --skip-dirs artifacts \
            --skip-dirs '**/bin' \
            --skip-dirs '**/obj' \
            --skip-dirs '**/node_modules' \
            --skip-dirs '**/target' \
            .

      - name: Convert Trivy report to SARIF
        if: always() && hashFiles('trivy.json') != ''
        run: trivy convert --format sarif --output trivy.sarif trivy.json

      - name: Report Trivy findings
        if: always() && hashFiles('trivy.json') != ''
        run: trivy convert --format table --exit-code 1 trivy.json

      # Intentional github/codeql-action v4 pin
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  semgrep:
    name: Semgrep Community SAST
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check "setuptools<82" semgrep==1.136.0

      - name: Scan repository with Semgrep
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude 'TestResults/**' \
            --exclude 'artifacts/**' \
            --exclude '**/bin/**' \
            --exclude '**/obj/**' \
            --exclude '**/node_modules/**' \
            --exclude '**/target/**' \
            --exclude-rule typescript.react.security.react-insecure-request.react-insecure-request \
            --sarif-output semgrep.sarif

      # Intentional github/codeql-action v4 pin
      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --verbose --redact --exit-code 2 --report-format sarif --report-path results.sarif --log-level debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gitleaks SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: gitleaks

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - build-test
      - python-gates
      - ts-gates
      - tauri-rust
      - codeql
      - trivy
      - semgrep
      - gitleaks
    if: always()
    steps:
      - name: Evaluate gate results
        run: |
          set -euo pipefail
          echo "## CI Results" > results.md
          echo "" >> results.md
          echo "| Job | Status |" >> results.md
          echo "|-----|--------|" >> results.md
          echo "| Build and test (.NET) | ${{ needs.build-test.result }} |" >> results.md
          echo "| Python ML Worker gates | ${{ needs.python-gates.result }} |" >> results.md
          echo "| TypeScript & React UI gates | ${{ needs.ts-gates.result }} |" >> results.md
          echo "| Tauri Rust gates | ${{ needs.tauri-rust.result }} |" >> results.md
          echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> results.md
          echo "" >> results.md
          echo "| Trivy OSS Security Scan | ${{ needs.trivy.result }} (advisory) |" >> results.md
          echo "| Semgrep Community SAST | ${{ needs.semgrep.result }} (advisory) |" >> results.md
          echo "| Secret Scan (gitleaks) | ${{ needs.gitleaks.result }} (advisory) |" >> results.md
          echo "" >> results.md

          FAILED=false
          for result in \
            "${{ needs.build-test.result }}" \
            "${{ needs.python-gates.result }}" \
            "${{ needs.ts-gates.result }}" \
            "${{ needs.tauri-rust.result }}" \
            "${{ needs.codeql.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED=true
              break
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "## Gate FAILED" >> results.md
            echo "" >> results.md
            echo "One or more required jobs failed or were cancelled." >> results.md
            cat results.md
            exit 1
          fi

          echo "## Gate PASSED" >> results.md
          echo "" >> results.md
          echo "All required checks passed." >> results.md
          cat results.md

      - name: Upload gate results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-results
          path: results.md
          retention-days: 14
